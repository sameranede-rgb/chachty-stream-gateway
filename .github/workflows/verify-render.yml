name: Verify Render Gateway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy and verify gateway
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://chachty-stream-gateway-1.onrender.com"
          for i in {1..20}; do
            echo "Attempt $i/20"
            HEALTH="$(curl -fsS --max-time 20 "$BASE/health" || true)"
            echo "HEALTH: $HEALTH"
            if echo "$HEALTH" | grep -q '"success":true' && echo "$HEALTH" | grep -q '"architecture":"render-direct-h5"'; then
              SEARCH="$(curl -fsS --max-time 30 "$BASE/search?q=Avatar" || true)"
              echo "SEARCH: $SEARCH"
              if echo "$SEARCH" | grep -q '"query":"Avatar"' && ! echo "$SEARCH" | grep -q '"error":"SEARCH_UPSTREAM_FAILED"'; then
                echo "Render gateway verification passed."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Render gateway verification failed after polling."
          exit 1
